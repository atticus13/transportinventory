<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Device Check-Out</title>
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .station { max-width: 980px; margin: 0 auto; padding: 22px; display: grid; gap: 18px; }
    .stage {
      border-radius: 22px; border: 1px solid var(--line);
      background: linear-gradient(160deg, var(--surface), var(--bg-2));
      min-height: 340px; display: grid; place-content: center; justify-items: center;
      text-align: center; gap: 10px; padding: 34px; transition: background 0.18s, border-color 0.18s;
    }
    .stage .icon { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; background: var(--blue-soft); color: var(--blue-hi); margin-bottom: 6px; }
    .stage .icon svg { width: 44px; height: 44px; }
    .stage .title { font-size: clamp(28px, 5vw, 48px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
    .stage .name { font-size: clamp(22px, 4vw, 36px); font-weight: 650; }
    .stage .sub { font-size: 18px; color: var(--muted); max-width: 640px; white-space: pre-line; }
    .stage .bar { width: min(420px, 80%); height: 6px; border-radius: 99px; background: var(--line-soft); overflow: hidden; margin-top: 12px; opacity: 0; }
    .stage .bar i { display: block; height: 100%; width: 100%; background: var(--orange); }
    .stage.pending { border-color: var(--blue-hi); }
    .stage.pending .bar { opacity: 1; }
    .stage.pending .icon { background: var(--orange-soft); color: var(--orange-hi); }
    .stage.out { background: linear-gradient(160deg, #3b1608, #1a1022); border-color: var(--orange); }
    .stage.out .icon { background: var(--orange-soft); color: var(--orange-hi); }
    .stage.out .title { color: var(--orange-hi); }
    .stage.in { background: linear-gradient(160deg, #08301f, #0c1a2b); border-color: var(--ok); }
    .stage.in .icon { background: var(--ok-soft); color: var(--ok); }
    .stage.in .title { color: var(--ok); }
    .stage.error { background: linear-gradient(160deg, #3b0d15, #1a1022); border-color: var(--err); }
    .stage.error .icon { background: var(--err-soft); color: var(--err); }
    .stage.error .title { color: var(--err); font-size: clamp(24px, 4vw, 38px); }

    .scanrow { display: flex; gap: 10px; }
    .scanrow input { font-family: var(--mono); font-size: 20px; padding: 15px 18px; border-radius: 12px; letter-spacing: 0.04em; }
    .scanrow input { flex: 1; min-width: 0; }

    /* Home: three big buttons */
    .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .mode { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 120px; padding: 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; text-align: center; cursor: pointer; width: 100%; }
    .mode:hover { border-color: var(--blue-hi); }
    .mode .mi { font-size: 34px; line-height: 1; }
    .mode b { font-size: 20px; }
    .mode small { color: var(--muted); font-size: 13.5px; font-weight: 500; line-height: 1.3; }
    .mode.m-out { background: linear-gradient(160deg, rgba(255,138,31,.22), rgba(255,138,31,.08)); border-color: rgba(255,138,31,.55); }
    .mode.m-in { background: linear-gradient(160deg, rgba(61,220,132,.20), rgba(61,220,132,.07)); border-color: rgba(61,220,132,.5); }
    .mode.m-report { background: rgba(245,158,11,.10); border-color: rgba(245,158,11,.45); color: #fbbf24; }
    .mode.m-report small { color: #d9a441; }
    .mode b, .mode small { display: block; }
    body:not(.home) .modes { display: none; }
    .station > .stage { order: 0; } .station > .modes { order: 1; } .station > .scanrow { order: 2; } .station > .keypad { order: 3; } .station > .recent-box { order: 4; }
    body.home:not(.kiosk) .stage { min-height: 220px; padding: 24px; }
    body.home .stage .icon { display: none; }
    body.home #backBtn { display: none; }
    body.home .scanrow #camBtn { display: none; }
    .why-chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .why-chips .btn { justify-content: center; min-height: 56px; font-size: 16px; white-space: normal; }

    /* Recent activity: always shown at the bottom on a big screen with a mouse; behind a button on phones and tablets */
    .recent-box > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; list-style: none; min-height: 44px; }
    .recent-box > summary::-webkit-details-marker { display: none; }
    .recent-box > summary h3 { margin: 0; }
    .recent-box[open] > summary { margin-bottom: 8px; }
    .recent-box .chev { color: var(--muted); transition: transform 0.15s; }
    .recent-box[open] .chev { transform: rotate(180deg); }
    @media (min-width: 900px) and (pointer: fine) {
      .recent-box > summary { pointer-events: none; cursor: default; min-height: 0; }
      .recent-box .chev { display: none; }
    }

    /* Touch screens (phones, tablets): bigger buttons and fields, number keyboard */
    @media (pointer: coarse) {
      body.home .scanrow { display: none; }
      .btn { min-height: 52px; font-size: 16px; padding: 12px 20px; }
      .btn.sm { min-height: 46px; padding: 10px 16px; }
      .scanrow input, .report-panel input { min-height: 58px; font-size: 22px; }
      .keypad { grid-template-columns: repeat(3, minmax(84px, 124px)); gap: 14px; }
      .keypad button { font-size: 34px; padding: 20px 0; }
      .mode { min-height: 132px; }
      .mode b { font-size: 22px; }
      .recent-box > summary { min-height: 52px; }
      .stage { min-height: 300px; }
    }
    @media (max-width: 560px) {
      .station { padding: 12px; gap: 14px; }
      .stage { padding: 22px 16px; min-height: 240px; border-radius: 18px; }
      .stage .icon { width: 68px; height: 68px; }
      .stage .icon svg { width: 34px; height: 34px; }
      .stage .sub { font-size: 16px; }
      .stage { min-height: 0 !important; padding: 14px 14px; gap: 4px; }
      .stage .icon { display: none; }
      .stage .title { font-size: 22px; }
      .stage .name { font-size: 20px; }
      .stage .sub { font-size: 14px; }
      .modes { grid-template-columns: 1fr; }
      .mode { flex-direction: row; justify-content: flex-start; text-align: left; min-height: 84px; gap: 16px; }
      .mode small { display: block; }
      .keypad { grid-template-columns: repeat(3, 1fr); }
      .scanrow { flex-wrap: wrap; }
      .scanrow input { flex: 1 1 100%; }
      .scanrow .btn { flex: 1 1 0; justify-content: center; }
      body:not(.kiosk) #kioskBtn, body:not(.kiosk) #clock { display: none; }
    }
    .recent-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
    .recent-row:first-child { border-top: 0; }
    .recent-row .who { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-row .t { color: var(--muted); font-size: 13px; }
    .help { color: var(--muted); font-size: 13.5px; margin-top: 8px; }
    .stage .pins { font-size: 34px; letter-spacing: 0.35em; min-height: 40px; color: var(--orange-hi); }
    .keypad { display: grid; grid-template-columns: repeat(3, 92px); gap: 10px; justify-content: center; }
    .keypad button { font-size: 28px; font-weight: 700; padding: 14px 0; border-radius: 14px; justify-content: center; }
    .issue-hint { margin-top: 10px; }
    .report-panel { width: min(640px, 100%); margin: 14px auto 0; display: grid; gap: 10px; }
    .report-panel input { font-size: 20px; padding: 14px 16px; text-align: center; }
    .report-panel .row { justify-content: center; }
    .warn-btn { background: rgba(245,158,11,.14); border-color: rgba(245,158,11,.5); color: #fbbf24; }
    body.kiosk .report-panel input { font-size: 28px; }
    select, textarea { width: 100%; }

    /* Kiosk mode: bigger, calmer, nothing to wander off to. Exit: click the clock 5 times, or Ctrl+Shift+K. */
    body.kiosk #kioskBtn, body.kiosk #adminLink, body.kiosk #signOut { display: none !important; }
    body.kiosk .station { max-width: 1280px; padding: 26px; }
    body.kiosk .stage { min-height: 52vh; }
    body.kiosk .stage .title { font-size: clamp(36px, 6.5vw, 76px); }
    body.kiosk .stage .name { font-size: clamp(28px, 5vw, 56px); }
    body.kiosk .stage .sub { font-size: 24px; max-width: 900px; }
    body.kiosk .stage .icon { width: 116px; height: 116px; }
    body.kiosk .stage .icon svg { width: 58px; height: 58px; }
    body.kiosk .help { font-size: 18px; }
    body.kiosk .keypad { grid-template-columns: repeat(3, 120px); }
    body.kiosk .keypad button { font-size: 36px; padding: 20px 0; }
    body.kiosk { cursor: default; user-select: none; }
    body.kiosk #clock { cursor: pointer; }
  </style>
</head>
<body>

  <!-- Not configured -->
  <div id="setup" class="login-wrap hidden">
    <div class="card login">
      <div class="notice"><b>Firebase isn't configured yet.</b><br />Open <span class="mono">docs/js/firebase-config.js</span> and paste in your Firebase web-app config. See README.md.</div>
    </div>
  </div>

  <!-- Sign in -->
  <div id="login" class="login-wrap hidden">
    <div class="card login">
      <div class="brand"><div class="mark">📱</div><div>Device Check-Out<small>Scan station sign-in</small></div></div>
      <form id="loginForm">
        <label class="f">Email<input id="lEmail" type="email" autocomplete="username" required /></label>
        <label class="f">Password<input id="lPass" type="password" autocomplete="current-password" required /></label>
        <div id="lErr" class="err-text"></div>
        <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
      </form>
      <p class="help">Use the shared station login. You only need to do this once per computer.</p>
    </div>
  </div>

  <!-- Station -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><div class="mark">📱</div><div id="brandName">Device Check-Out<small id="brandOrg"></small></div></div>
      <div class="spacer"></div>
      <div class="muted mono" id="clock"></div>
      <button class="btn ghost sm" id="kioskBtn" title="Full screen, big buttons, for the check-out computer">Kiosk mode</button>
      <a class="btn ghost sm hidden" id="adminLink" href="admin.html">Admin</a>
      <button class="btn ghost sm" id="signOut" title="Sign this station out">Sign out</button>
    </header>

    <main class="station">
      <section id="stage" class="stage idle" aria-live="polite">
        <div class="icon" id="stIcon"></div>
        <div class="title" id="stTitle"></div>
        <div class="name" id="stName"></div>
        <div class="sub" id="stSub"></div>
        <div class="pins hidden" id="stPins" aria-hidden="true"></div>
        <button class="btn sm issue-hint hidden" id="issueHint" type="button"></button>
        <div id="reportPanel" class="report-panel hidden">
          <div class="why-chips" id="whyChips">
            <button class="btn" type="button" data-why="Cracked screen">Cracked screen</button>
            <button class="btn" type="button" data-why="Won't charge">Won't charge</button>
            <button class="btn" type="button" data-why="Won't turn on">Won't turn on</button>
            <button class="btn" type="button" data-why="Case missing or broken">Case missing or broken</button>
            <button class="btn" type="button" id="whyOther" style="grid-column:1/-1">Something else…</button>
          </div>
          <form id="otherForm" class="hidden" autocomplete="off">
            <input id="rNote" type="text" maxlength="300" placeholder="What's wrong?" aria-label="What is wrong with the device" />
            <div class="row"><button class="btn primary" type="submit">Next</button></div>
          </form>
          <div class="row"><button class="btn ghost" type="button" id="reportCancel">Cancel</button></div>
          <div class="err-text" id="rErr"></div>
        </div>
        <div class="bar"><i id="stBar"></i></div>
      </section>

      <div class="scanrow">
        <input id="scan" type="text" inputmode="none" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Scanner ready" aria-label="Barcode scan field" />
        <button class="btn primary" id="camBtn" type="button" hidden aria-label="Scan with the camera">📷 Camera</button>
        <button class="btn" id="backBtn" type="button" title="Back to the start (Esc)">← Back</button>
      </div>

      <div class="keypad hidden" id="keypad" aria-label="PIN keypad">
        <button class="btn" data-k="1">1</button><button class="btn" data-k="2">2</button><button class="btn" data-k="3">3</button>
        <button class="btn" data-k="4">4</button><button class="btn" data-k="5">5</button><button class="btn" data-k="6">6</button>
        <button class="btn" data-k="7">7</button><button class="btn" data-k="8">8</button><button class="btn" data-k="9">9</button>
        <button class="btn" data-k="back" aria-label="Backspace">⌫</button><button class="btn" data-k="0">0</button><button class="btn primary" data-k="enter" aria-label="Enter">↵</button>
      </div>

      <div class="modes">
        <button class="mode m-out" id="modeOut" type="button"><span class="mi" aria-hidden="true">➜</span><span><b>Check out</b><small>Take a device</small></span></button>
        <button class="mode m-in" id="modeIn" type="button"><span class="mi" aria-hidden="true">✔</span><span><b>Check in</b><small>Return a device</small></span></button>
        <button class="mode m-report" id="modeReport" type="button"><span class="mi" aria-hidden="true">⚠</span><span><b>Report damaged</b><small>Something's wrong with a device</small></span></button>
      </div>

      <details class="card recent-box" id="recentBox">
        <summary><h3>Recent activity</h3><span class="chev" aria-hidden="true">▾</span></summary>
        <div id="recent"><div class="empty">Loading…</div></div>
      </details>
    </main>
  </div>

  <script type="module" src="js/station.js?v=12"></script>
</body>
</html>
